# Choose the frontend in Preferences; the helper checks its dependencies.
# Desktop mode opens LocalSend with the selection loaded; the device is
# picked in its window (the app has no headless send).
name = "Send via LocalSend"
plural = "Send selected via LocalSend"
command = "omanta-localsend %F"
requires = ["omanta-localsend"]
option = "backend"
option_label = "LocalSend version"
option_choices = ["desktop=Desktop app", "bar=Omarchy bar plugin"]
