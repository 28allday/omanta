# Open LocalSend with the selection loaded for sending; the device is picked
# in its window (the app has no headless send). Hidden when the native
# localsend binary is absent (the old extension's flatpak fallback is not
# carried over — install the package).
name = "Send via LocalSend"
plural = "Send selected via LocalSend"
command = "localsend %F"
requires = ["localsend"]
